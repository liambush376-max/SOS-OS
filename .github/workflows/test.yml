name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit, config and app start-up tests (Debian 13)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git ca-certificates python3 python3-pytest python3-pyqt6 python3-psutil python3-yaml \
            libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m pytest tests -v --ignore=tests/iso

  package:
    name: Build and inspect sos-os-core.deb
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git ca-certificates dpkg-dev librsvg2-bin python3 lintian

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build package
        run: ./scripts/build-packages.sh out

      - name: Inspect package
        run: |
          deb="$(ls out/sos-os-core_*_all.deb)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | tee contents.txt
          for f in ./usr/bin/sos-settings ./usr/libexec/sos-os/sos-helper ./usr/lib/os-release \
                   ./usr/share/sddm/themes/sos/Main.qml ./usr/share/plymouth/themes/sos/logo.png \
                   ./usr/share/wallpapers/SOS-Aurora/contents/images/3840x2160.png; do
            grep -q " $f\$" contents.txt || { echo "::error::package is missing $f"; exit 1; }
          done
          # Informational: lintian is noisy for hand-built packages.
          lintian --no-tag-display-limit "$deb" || true
