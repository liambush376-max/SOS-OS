name: Release

# Publishing is gated twice:
#  1. only tags matching vMAJOR.MINOR.PATCH[-pre] that equal the VERSION file;
#  2. the `release` environment, which maintainers should configure with
#     required reviewers (Settings → Environments → release).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag matches VERSION
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match VERSION file ($version)"
            exit 1
          fi
          # Anything below 1.0.0, or with a pre-release suffix, is never marked stable.
          if [[ "$version" == 0.* || "$version" == *-* ]]; then pre=true; else pre=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  build:
    needs: verify-tag
    uses: ./.github/workflows/build-iso.yml

  publish:
    name: Publish GitHub Release
    needs: [verify-tag, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download ISO
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sos-os-iso
          path: out

      - name: Verify checksum and split if larger than the 2 GiB asset limit
        id: assets
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          cd out
          iso="sos-os-$VERSION-amd64.iso"
          sha256sum -c "$iso.sha256"
          limit=$((2 * 1024 * 1024 * 1024 - 1))
          if [ "$(stat -c %s "$iso")" -gt "$limit" ]; then
            echo "ISO exceeds GitHub's 2 GiB per-asset limit; splitting into 1900 MiB parts"
            split -b 1900M -d -a 2 "$iso" "$iso.part-"
            rm "$iso"
            sha256sum "$iso".part-* > "$iso.parts.sha256"
            echo "split=true" >> "$GITHUB_OUTPUT"
          else
            echo "split=false" >> "$GITHUB_OUTPUT"
          fi
          ls -lh

      - name: Compose release notes
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
          SPLIT: ${{ steps.assets.outputs.split }}
        run: |
          notes="docs/release-notes/v$VERSION.md"
          [ -f "$notes" ] || notes="docs/release-notes/TEMPLATE.md"
          sed "s/@VERSION@/$VERSION/g" "$notes" > release-notes.md
          if [ "$SPLIT" = true ]; then
            {
              echo
              echo "### Download in parts"
              echo "This ISO is larger than GitHub's 2 GiB file limit, so it's split. Download every \`.part-NN\` file, then:"
              echo '```bash'
              echo "sha256sum -c sos-os-$VERSION-amd64.iso.parts.sha256"
              echo "cat sos-os-$VERSION-amd64.iso.part-* > sos-os-$VERSION-amd64.iso"
              echo "sha256sum -c sos-os-$VERSION-amd64.iso.sha256"
              echo '```'
            } >> release-notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          flags=(--verify-tag --title "SOS OS $VERSION" --notes-file release-notes.md)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" "${flags[@]}" out/*
