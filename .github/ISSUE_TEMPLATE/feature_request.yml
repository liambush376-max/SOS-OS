name: Feature request
description: Suggest an improvement to SOS OS
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: dropdown
    id: milestone
    attributes:
      label: Suggested milestone
      options:
        - v0.2.0 (custom desktop design)
        - v0.3.0 (core applications)
        - v0.4.0 (installer integration)
        - v0.5.0 (hardware compatibility)
        - v0.9.0 (beta)
        - v1.0.0 (stable)
        - Later
