<?xml version="1.0" encoding="UTF-8"?>
<!-- SOS Aurora: default SOS OS wallpaper. Original artwork, GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060F"/>
      <stop offset="1" stop-color="#0B0A24"/>
    </linearGradient>
    <radialGradient id="blue" cx="0.22" cy="0.78" r="0.55">
      <stop offset="0" stop-color="#2F7BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2F7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple" cx="0.8" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#9B3DFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9B3DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7BFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#2F7BFF" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#B04DFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#B04DFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="haze" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>
  <rect width="3840" height="2160" fill="url(#bg)"/>
  <rect width="3840" height="2160" fill="url(#blue)"/>
  <rect width="3840" height="2160" fill="url(#purple)"/>
  <!-- Aurora ribbons -->
  <path d="M -200 1500 C 700 1150, 1500 1700, 2300 1250 S 3600 900, 4100 1100"
        fill="none" stroke="url(#band)" stroke-width="220" filter="url(#haze)"/>
  <path d="M -200 1460 C 700 1110, 1500 1660, 2300 1210 S 3600 860, 4100 1060"
        fill="none" stroke="url(#band)" stroke-width="10" opacity="0.9" filter="url(#soft)"/>
  <path d="M -200 1620 C 800 1320, 1600 1840, 2400 1420 S 3500 1100, 4100 1300"
        fill="none" stroke="url(#band)" stroke-width="4" opacity="0.6"/>
  <!-- Ring echo of the logo, very subtle -->
  <circle cx="2900" cy="760" r="420" fill="none" stroke="#6C4DFF" stroke-opacity="0.12" stroke-width="40"/>
  <circle cx="2900" cy="760" r="260" fill="none" stroke="#2F7BFF" stroke-opacity="0.08" stroke-width="12"/>
  <!-- Stars -->
  <g fill="#FFFFFF">
    <circle cx="310" cy="220" r="2.5" opacity="0.7"/><circle cx="780" cy="410" r="1.8" opacity="0.5"/>
    <circle cx="1220" cy="160" r="2.2" opacity="0.6"/><circle cx="1650" cy="520" r="1.5" opacity="0.4"/>
    <circle cx="2100" cy="300" r="2.8" opacity="0.7"/><circle cx="2480" cy="120" r="1.6" opacity="0.5"/>
    <circle cx="3350" cy="380" r="2.4" opacity="0.6"/><circle cx="3620" cy="180" r="1.7" opacity="0.5"/>
    <circle cx="540" cy="760" r="1.4" opacity="0.4"/><circle cx="1900" cy="820" r="1.9" opacity="0.4"/>
    <circle cx="3100" cy="1500" r="1.6" opacity="0.35"/><circle cx="900" cy="1900" r="2.0" opacity="0.3"/>
  </g>
</svg>
