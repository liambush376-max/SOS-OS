<?xml version="1.0" encoding="UTF-8"?>
<!-- SOS Nebula: alternative SOS OS wallpaper. Original artwork, GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#14123A"/>
      <stop offset="1" stop-color="#04040B"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B04DFF" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#6C4DFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2F7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#B04DFF"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="3840" height="2160" fill="url(#bg)"/>
  <ellipse cx="1920" cy="1080" rx="1500" ry="900" fill="url(#core)" filter="url(#blur)"/>
  <g fill="none" stroke="url(#arc)" stroke-linecap="round">
    <ellipse cx="1920" cy="1080" rx="1250" ry="420" stroke-width="6" opacity="0.55" transform="rotate(-14 1920 1080)"/>
    <ellipse cx="1920" cy="1080" rx="1250" ry="420" stroke-width="40" opacity="0.25" filter="url(#glow)" transform="rotate(-14 1920 1080)"/>
    <ellipse cx="1920" cy="1080" rx="900" ry="280" stroke-width="3" opacity="0.4" transform="rotate(10 1920 1080)"/>
  </g>
  <circle cx="1920" cy="1080" r="120" fill="#CFE0FF" opacity="0.85" filter="url(#glow)"/>
  <g fill="#FFFFFF">
    <circle cx="420" cy="300" r="2.2" opacity="0.6"/><circle cx="3400" cy="260" r="2.6" opacity="0.6"/>
    <circle cx="700" cy="1800" r="1.8" opacity="0.5"/><circle cx="3200" cy="1880" r="2.0" opacity="0.5"/>
    <circle cx="1500" cy="200" r="1.5" opacity="0.4"/><circle cx="2700" cy="560" r="1.7" opacity="0.4"/>
  </g>
</svg>
