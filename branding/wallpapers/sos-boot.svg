<?xml version="1.0" encoding="UTF-8"?>
<!-- SOS boot menu background (GRUB / ISOLINUX). Kept dark and low-detail so
     menu text stays readable. Original artwork, GPL-3.0-or-later. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060F"/>
      <stop offset="1" stop-color="#120B2E"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#B04DFF"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g transform="translate(1540 540) scale(1.6) translate(-128 -128)" opacity="0.35"
     fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="round">
    <path d="M 160.5 49.6 A 84 84 0 0 1 206.4 95.5"/>
    <path d="M 206.4 160.5 A 84 84 0 0 1 160.5 206.4"/>
    <path d="M 95.5 206.4 A 84 84 0 0 1 49.6 160.5"/>
    <path d="M 49.6 95.5 A 84 84 0 0 1 95.5 49.6"/>
  </g>
  <rect x="0" y="1040" width="1920" height="4" fill="url(#ring)" opacity="0.7"/>
</svg>
