<?xml version="1.0" encoding="UTF-8"?>
<!-- SOS OS logo: a split "beacon ring" (rescue-ring motif) around a core.
     Original artwork, GPL-3.0-or-later, SOS OS Project. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="0.55" stop-color="#6C4DFF"/>
      <stop offset="1" stop-color="#B04DFF"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#9FC2FF"/>
      <stop offset="1" stop-color="#2F7BFF"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Four ring segments with gaps at 45 degree diagonals -->
  <g fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="round" filter="url(#glow)">
    <path d="M 160.5 49.6 A 84 84 0 0 1 206.4 95.5"/>
    <path d="M 206.4 160.5 A 84 84 0 0 1 160.5 206.4"/>
    <path d="M 95.5 206.4 A 84 84 0 0 1 49.6 160.5"/>
    <path d="M 49.6 95.5 A 84 84 0 0 1 95.5 49.6"/>
  </g>
  <!-- Inner orbit -->
  <circle cx="128" cy="128" r="52" fill="none" stroke="#6C4DFF" stroke-opacity="0.55" stroke-width="4"/>
  <!-- Core -->
  <circle cx="128" cy="128" r="30" fill="url(#core)" filter="url(#glow)"/>
</svg>
