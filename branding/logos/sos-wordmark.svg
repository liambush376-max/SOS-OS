<?xml version="1.0" encoding="UTF-8"?>
<!-- SOS OS wordmark (logo + text). Text uses a system sans font; for print
     use, convert text to paths. GPL-3.0-or-later, SOS OS Project. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 256" width="760" height="256">
  <defs>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#B04DFF"/>
    </linearGradient>
  </defs>
  <image href="sos-logo.svg" xlink:href="sos-logo.svg" x="0" y="0" width="256" height="256"/>
  <text x="290" y="162" font-family="Noto Sans, Inter, Segoe UI, sans-serif" font-size="120"
        font-weight="800" letter-spacing="6" fill="url(#text)">SOS</text>
  <text x="560" y="162" font-family="Noto Sans, Inter, Segoe UI, sans-serif" font-size="120"
        font-weight="300" fill="#E6E9FF">OS</text>
</svg>
